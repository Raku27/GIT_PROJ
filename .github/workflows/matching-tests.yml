name: Matching service tests
on:
  push:
    paths: ['02-matching-project/**', '03-engineering-pipeline-agent/runner/**', '03-engineering-pipeline-agent/run_pipeline.py', '03-engineering-pipeline-agent/configs/matching.json', '.github/workflows/matching-tests.yml']
  pull_request:
    paths: ['02-matching-project/**', '03-engineering-pipeline-agent/runner/**', '03-engineering-pipeline-agent/run_pipeline.py', '03-engineering-pipeline-agent/configs/matching.json', '.github/workflows/matching-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-matching-project
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 02-matching-project/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Run Matching API through the common runner
        run: python 03-engineering-pipeline-agent/run_pipeline.py --config 03-engineering-pipeline-agent/configs/matching.json --workspace .
        working-directory: ${{ github.workspace }}
      - name: Save command logs and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: matching-runner-report
          path: .pipeline-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
