name: Matching service tests
on:
  push:
    paths: ['02-matching-project/**', '.github/workflows/matching-tests.yml']
  pull_request:
    paths: ['02-matching-project/**', '.github/workflows/matching-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-matching-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 02-matching-project/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check src tests examples benchmarks example_usage.py
      - run: python -m ruff format --check src tests examples benchmarks example_usage.py
      - run: python -m pip check
      - run: python -m pytest --cov=src --cov-report=term-missing
      - run: python example_usage.py
      - run: python -m examples.algorithm_tradeoff
      - run: python -m benchmarks.run --sizes 2 --repeats 1 --output /tmp/matching-benchmark-smoke.json
